<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Bufo</title>
  <defs>
    <path id="toad" d="M-4 44 H9 Q13 44 16 39.5 Q17.3 34.5 22.3 33.4 C17.3 33 17.8 24.8 23.6 24.8 C29.4 24.8 29.2 33 25.2 33 M38.8 33 C34.8 33 34.6 24.8 40.4 24.8 C46.2 24.8 46.7 33 41.7 33.4 Q46.7 34.5 48 39.5 Q51 44 55 44 H68"/>
    <filter id="halo" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="small-halo" x="-50%" y="-100%" width="200%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <radialGradient id="bloom" cx="50%" cy="56%" r="45%">
      <stop offset="0" stop-color="#FFB238" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FFB238" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    #small { display: none; }
    /* An SVG image's viewport follows its displayed size, including browser tabs. */
    @media (max-width: 32px) {
      #large { display: none; }
      #small { display: inline; }
    }
  </style>
  <rect width="64" height="64" rx="15" fill="#15191F"/>
  <rect width="64" height="64" rx="15" fill="url(#bloom)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- A neon tube: a halo, a deeper orange rim, the lit glass, a white-hot core. -->
    <g id="large">
      <use href="#toad" stroke="#FFB238" stroke-width="8" opacity=".5" filter="url(#halo)"/>
      <use href="#toad" stroke="#C9781A" stroke-width="4.6"/>
      <use href="#toad" stroke="#FFD27F" stroke-width="3.4"/>
      <use href="#toad" stroke="#FFF3D6" stroke-width="1.1"/>
    </g>
    <g id="small">
      <!-- A tight bright line, then a much dimmer, wider pool of light. -->
      <use href="#toad" stroke="#FFB238" stroke-width="8" opacity=".45" filter="url(#small-halo)"/>
      <use href="#toad" stroke="#C9781A" stroke-width="4.4"/>
      <use href="#toad" stroke="#FFD27F" stroke-width="3.4"/>
      <use href="#toad" stroke="#FFF7E6" stroke-width="1.3"/>
    </g>
  </g>
</svg>
